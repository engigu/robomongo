name: Build Robo 3T Windows EXE (Pure App Build)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Robo 3T
        uses: actions/checkout@v4

      - name: Checkout Robo Shell
        uses: actions/checkout@v4
        with:
          repository: paralect/robomongo-shell
          ref: roboshell-v4.2
          path: robo-shell

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MSVC v141 Toolset Component
        run: |
          $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $process = Start-Process -FilePath $vsInstaller -ArgumentList "modify --installPath ""C:\Program Files\Microsoft Visual Studio\2022\Enterprise"" --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.VC.v141.ATL --add Microsoft.VisualStudio.Component.VC.v141.MFC --quiet --norestart" -PassThru
          while (!$process.HasExited) { Start-Sleep -Seconds 30 }
        shell: powershell

      - name: Setup MSVC (v141 Toolset)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.1'
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action/action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qtwebengine'

      - name: Cache Robo Shell (Restoring from Cloud)
        uses: actions/cache@v4
        with:
          path: robo-shell/build
          key: ${{ runner.os }}-robo-shell-v141-${{ hashFiles('fix/apply_patches.py') }}
          restore-keys: |
            ${{ runner.os }}-robo-shell-v141-
          fail-on-cache-miss: true

      - name: Install OpenSSL
        run: choco install openssl --version=1.1.1.2100 -y --no-progress

      - name: Locate OpenSSL
        run: |
          dir "C:\Program Files\OpenSSL*" /s /b | findstr "opensslconf.h"
          set OPENSSL_REAL_PATH=C:\Program Files\OpenSSL-Win64
          if not exist "C:\Program Files\OpenSSL-Win64" set OPENSSL_REAL_PATH=C:\Program Files\OpenSSL
          echo OPENSSL_PATH=%OPENSSL_REAL_PATH% >> %GITHUB_ENV%
        shell: cmd

      - name: Configure and Build Robo 3T
        run: |
          subst S: "${{ github.workspace }}\robo-shell"
          subst R: "${{ github.workspace }}"
          mkdir D:\b
          mkdir D:\dist
          cd /d D:\b
          cmake -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="${{ env.Qt5_Dir }}" ^
            -DMongoDB_DIR="S:" ^
            -DOpenSSL_DIR="${{ env.OPENSSL_PATH }}" ^
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="D:\dist" ^
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="D:\dist" ^
            R:
          ninja -v
        shell: cmd

      - name: Prepare Release Package
        run: |
          if not exist D:\dist\robo3t.exe (
            echo "FATAL: robo3t.exe was not created in D:\dist"
            exit 1
          )
          
          # 核心修复：使用 windeployqt 自动部署所有 Qt 依赖 DLL
          cd /d D:\dist
          "${{ env.Qt5_Dir }}\bin\windeployqt.exe" --release --no-translations --no-opengl-sw --no-compiler-runtime robo3t.exe
          
          # 拷贝 OpenSSL DLL
          copy "${{ env.OPENSSL_PATH }}\bin\*.dll" D:\dist\
          
          # 打包
          powershell Compress-Archive -Path * -DestinationPath robo3t-v1.5.0-windows-x64.zip
        shell: cmd

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: D:/dist/robo3t-v1.5.0-windows-x64.zip
          name: Robo 3T v1.5.0 Official Release
          body: |
            ## Robo 3T v1.5.0
            
            Official stable release for Windows.
            
            ### Fixes:
            - **Complete Dependency Bundling**: Now includes all necessary Qt and OpenSSL DLLs via `windeployqt`.
            - **Fixed Source Compilation**: Resolved duplicate symbol and namespace ambiguity.
            - **High Performance Build**: Ninja-linked binary for modern Windows systems.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: robo3t-final-binary
          path: D:\dist\robo3t-v1.5.0-windows-x64.zip

      - name: Cleanup Virtual Drives
        if: always()
        run: |
          subst S: /D || echo "S: already unmapped"
          subst R: /D || echo "R: already unmapped"
        shell: cmd
