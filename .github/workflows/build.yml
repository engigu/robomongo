name: Build Robo 3T Windows EXE

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Robo 3T
        uses: actions/checkout@v4
        with:
          path: robomongo

      - name: Checkout Robo Shell
        uses: actions/checkout@v4
        with:
          repository: robomongo/robo-shell
          ref: robo3.4.0-1
          path: robo-shell

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC (VS 2022)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (SCons)
        run: |
          python -m pip install scons==3.1.2

      - name: Install Qt
        uses: jurplel/install-qt-action/action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qtwebengine'

      - name: Apply Universal Patches
        run: |
          cd robomongo
          python fix/apply_patches.py
        shell: pwsh

      - name: Build Robo Shell (if not cached)
        id: cache-shell
        uses: actions/cache@v4
        with:
          path: robo-shell/build/opt
          key: ${{ runner.os }}-robo-shell-${{ hashFiles('robomongo/fix/apply_patches.py') }}

      - name: Compilation - Robo Shell
        run: |
          cd robo-shell
          scons --ssl --opt=on --allow-warnings-as-errors=off mongo.exe -j 2
        shell: cmd

      - name: Configure and Build Robo 3T
        run: |
          cd robomongo
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.Qt5_Dir }}" -DPROJ_ROBO_SHELL_PATH="../../robo-shell" ..
          cmake --build . --config Release -j 2
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: robo3t-windows-exe
          path: |
            robomongo/build/bin/Release/robo3t.exe
            robomongo/build/bin/Release/*.dll
