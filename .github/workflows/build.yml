name: Build Robo 3T Windows EXE (Pure App Build)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Robo 3T
        uses: actions/checkout@v4

      - name: Checkout Robo Shell
        uses: actions/checkout@v4
        with:
          repository: paralect/robomongo-shell
          ref: roboshell-v4.2
          path: robo-shell

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MSVC v141 Toolset Component
        run: |
          $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $process = Start-Process -FilePath $vsInstaller -ArgumentList "modify --installPath ""C:\Program Files\Microsoft Visual Studio\2022\Enterprise"" --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.VC.v141.ATL --add Microsoft.VisualStudio.Component.VC.v141.MFC --quiet --norestart" -PassThru
          while (!$process.HasExited) { Start-Sleep -Seconds 30 }
        shell: powershell

      - name: Setup MSVC (v141 Toolset)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.1'
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action/action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qtwebengine'

      - name: Cache Robo Shell (Restoring from Cloud)
        uses: actions/cache@v4
        with:
          path: robo-shell/build
          key: ${{ runner.os }}-robo-shell-v141-stable
          restore-keys: |
            ${{ runner.os }}-robo-shell-v141-
          fail-on-cache-miss: false

      # [STANDBY: FULL SHELL BUILD LOGIC - Currently using Cloud Cache]
      # - name: Build Robo Shell (if not cached)
      #   if: steps.cache-shell.outputs.cache-hit != 'true'
      #   run: |
      #     cd robo-shell
      #     python -m pip install scons==4.4.0
      #     .\bin\build.bat
      #   shell: cmd

      - name: Install OpenSSL
        run: choco install openssl --version=1.1.1.2100 -y --no-progress

      - name: Locate OpenSSL
        run: |
          :: 优先尝试 Choco 默认路径，否则全盘搜索
          set OPENSSL_REAL_PATH=C:\Program Files\OpenSSL
          if not exist "%OPENSSL_REAL_PATH%\bin\libcrypto-1_1-x64.dll" (
            dir "C:\Program Files\OpenSSL*" /s /b | findstr /i "libcrypto-1_1-x64.dll"
            set OPENSSL_REAL_PATH=C:\Program Files\OpenSSL-Win64
          )
          if not exist "C:\Program Files\OpenSSL-Win64" (
             if not exist "C:\Program Files\OpenSSL" set OPENSSL_REAL_PATH=C:\OpenSSL-Win64
          )
          echo OPENSSL_PATH=%OPENSSL_REAL_PATH%>>%GITHUB_ENV%
        shell: cmd

      - name: Configure and Build Robo 3T
        run: |
          subst S: "${{ github.workspace }}\robo-shell"
          subst R: "${{ github.workspace }}"
          mkdir D:\b
          mkdir D:\dist
          cd /d D:\b
          cmake -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="${{ env.Qt5_Dir }}" ^
            -DMongoDB_DIR="S:" ^
            -DOpenSSL_DIR="${{ env.OPENSSL_PATH }}" ^
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="D:\dist" ^
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="D:\dist" ^
            R:
          ninja -v
        shell: cmd

      - name: Build and Package Robo 3T
        run: |
          subst S: "${{ github.workspace }}\robo-shell"
          subst R: "${{ github.workspace }}"
          cd /d D:\b
          
          :: 构建与安装到本地目录
          ninja install
          
          :: 使用 CPack 生成打包产物 (内部会调用我们注入的 windeployqt)
          cpack -G ZIP
          cpack -G NSIS
          
          :: 准备产物到 dist 目录供后续上传
          mkdir D:\dist
          copy package\*.zip D:\dist\
          copy package\*.exe D:\dist\
          
          dir D:\dist
        shell: cmd

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            D:/dist/*.zip
            D:/dist/*.exe
          name: Robo 3T ${{ github.ref_name }} Reborn Release
          body: |
            ## Robo 3T ${{ github.ref_name }} Standard Release
            
            This release provides both **Installer (Setup)** and **Portable** versions for Windows.
            
            ### Fixes & Features:
            - **Chinese Localization**: Added language switching support (Options -> Language).
            - **Modernized Welcome Page**: Rebranded welcome screen with v1.5.0 highlights.
            - **Complete Dependency Bundling**: Fully integrated Qt and OpenSSL 1.1.1 DLLs.
            - **Dual Distribution**: Professional NSIS installer + Plug-and-Play portable ZIP.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robo3t-final-packages
          path: D:\dist\*
          retention-days: 7

      - name: Cleanup Virtual Drives
        if: always()
        run: |
          subst S: /D || echo "S: already unmapped"
          subst R: /D || echo "R: already unmapped"
        shell: cmd
