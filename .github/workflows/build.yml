name: Build Robo 3T Windows EXE (Force v141 on VS 2022)

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Robo 3T
        uses: actions/checkout@v4
        with:
          path: robomongo

      - name: Checkout Robo Shell
        uses: actions/checkout@v4
        with:
          repository: paralect/robomongo-shell
          ref: roboshell-v4.2
          path: robo-shell

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MSVC v141 Toolset Component
        run: |
          Write-Host "Starting VS 2022 modification to add v141..."
          $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $process = Start-Process -FilePath $vsInstaller -ArgumentList "modify --installPath ""C:\Program Files\Microsoft Visual Studio\2022\Enterprise"" --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --quiet --norestart" -Wait -PassThru
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "VS Installer failed with exit code: $($process.ExitCode)"
          }
          Write-Host "VS modification complete."
        shell: powershell

      - name: Setup MSVC (v141 Toolset)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.1'
          arch: x64

      - name: Install dependencies (SCons)
        run: |
          python -m pip install scons==3.1.2

      - name: Install Qt
        uses: jurplel/install-qt-action/action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qtwebengine'

      - name: Apply Minimal Env Patch
        run: |
          cd robomongo
          python fix/apply_patches.py
        shell: pwsh

      - name: Cache Robo Shell
        id: cache-shell
        uses: actions/cache@v4
        with:
          path: robo-shell/build
          key: ${{ runner.os }}-robo-shell-v141-${{ hashFiles('fix/apply_patches.py') }}

      - name: Build Robo Shell
        if: steps.cache-shell.outputs.cache-hit != 'true'
        run: |
          cd robo-shell
          scons --ssl --opt=on mongo.exe -j 2 --link-model=object MONGO_VERSION=3.4.0
        shell: cmd

      - name: Configure and Build Robo 3T
        run: |
          cd robomongo
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -T v141 -DCMAKE_PREFIX_PATH="${{ env.Qt5_Dir }}" -DPROJ_ROBO_SHELL_PATH="../../robo-shell" ..
          cmake --build . --config Release -j 2
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: robo3t-v141-on-2022
          path: |
            robomongo/build/bin/Release/robo3t.exe
            robomongo/build/bin/Release/*.dll
