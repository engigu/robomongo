name: Build Robo 3T Windows EXE (Pure App Build)

on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Robo 3T
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC (v143 Toolset)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Robo Shell (Restoring from Cloud)
        id: cache-robo-shell
        uses: actions/cache@v4
        with:
          path: robomongo-shell-roboshell-v4.2/build
          key: ${{ runner.os }}-robo-shell-v143-stable
          restore-keys: |
            ${{ runner.os }}-robo-shell-v143-
          fail-on-cache-miss: false

      - name: Build Robo Shell (Fallback)
        if: steps.cache-robo-shell.outputs.cache-hit != 'true'
        run: |
          :: Install SCons and dependencies
          python -m pip install scons==4.5.2 pyyaml Cheetah3 psutil
          
          :: Build
          if not exist "robomongo-shell-roboshell-v4.2" (
            echo "Error: robomongo-shell-roboshell-v4.2 directory not found!"
            exit /b 1
          )
          cd robomongo-shell-roboshell-v4.2
          python -m SCons mongo.exe MONGO_VERSION=4.2.0 --release -j2 --link-model=object --disable-warnings-as-errors --cxx-std=14
        shell: cmd

      - name: Install Qt
        uses: jurplel/install-qt-action/action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: qtcharts qtwebengine

      - name: Install Dependencies (OpenSSL, NSIS)
        run: |
          choco install openssl --version=1.1.1.2100 -y --no-progress
          choco install nsis -y --no-progress

      - name: Locate OpenSSL
        run: |
          :: 优先尝试 Choco 默认路径，否则全盘搜索
          set OPENSSL_REAL_PATH=C:\Program Files\OpenSSL
          if not exist "%OPENSSL_REAL_PATH%\bin\libcrypto-1_1-x64.dll" (
            dir "C:\Program Files\OpenSSL*" /s /b | findstr /i "libcrypto-1_1-x64.dll"
            set OPENSSL_REAL_PATH=C:\Program Files\OpenSSL-Win64
          )
          if not exist "C:\Program Files\OpenSSL-Win64" (
             if not exist "C:\Program Files\OpenSSL" set OPENSSL_REAL_PATH=C:\OpenSSL-Win64
          )
          echo OPENSSL_PATH=%OPENSSL_REAL_PATH%>>%GITHUB_ENV%
        shell: cmd

      - name: Configure and Build Robo 3T
        run: |
          if not exist "robomongo-shell-roboshell-v4.2\build" mkdir "robomongo-shell-roboshell-v4.2\build"
          subst S: "%GITHUB_WORKSPACE%\robomongo-shell-roboshell-v4.2"
          subst R: "%GITHUB_WORKSPACE%"
          mkdir D:\b
          mkdir D:\dist
          cd /d D:\b
          cmake -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="${{ env.Qt5_Dir }}" ^
            -DMongoDB_DIR="S:" ^
            -DOpenSSL_DIR="${{ env.OPENSSL_PATH }}" ^
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="D:\dist" ^
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="D:\dist" ^
            R:
          ninja -v
        shell: cmd

      - name: Build and Package Robo 3T
        run: |
          :: 准备基础虚盘映射以缩短路径，防止 NSIS 路径溢出
          subst S: "%GITHUB_WORKSPACE%\robomongo-shell-roboshell-v4.2" 2>nul || echo S: already mapped
          subst R: "%GITHUB_WORKSPACE%" 2>nul || echo R: already mapped
          cd /d D:\b
          
          :: 准备环境 PATH
          set "PATH=${{ env.Qt5_Dir }}\bin;${{ env.OPENSSL_PATH }}\bin;%PATH%"
          
          :: 1. 编译并安装
          ninja install
          
          :: 2. 执行 CPack 打包
          echo "Starting ZIP packaging..."
          cpack -G ZIP
          echo "Starting NSIS packaging (Installer)..."
          cpack -G NSIS
          
          :: 3. 整理产物 (深度探测模式)
          set "DIST_DIR=%GITHUB_WORKSPACE%\dist"
          if not exist "%DIST_DIR%" mkdir "%DIST_DIR%"
          
          echo "Scanning D:\b\package for final artifacts..."
          dir /s D:\b\package\*.zip D:\b\package\*.exe
          
          copy /y D:\b\package\*.zip "%DIST_DIR%\"
          copy /y D:\b\package\*.exe "%DIST_DIR%\"
          
          :: 验证 dist 目录内容
          echo "Final verified packages in dist/ :"
          dir "%DIST_DIR%"
        shell: cmd

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.exe
          fail_on_unmatched_files: false
          name: Robo 3T ${{ github.ref_name }} Reborn Release
          body: |
            ## Robo 3T ${{ github.ref_name }} Standard Release
            
            This release provides both **Installer (Setup)** and **Portable** versions for Windows (64-bit).
            
            ### Fixes & Features:
            - **WebEngine Integrated**: Fully bundled all DLLs for the integrated web engine.
            - **SSL Connection Fixed**: Resolved tooltip and pointer errors in SSL tabs.
            - **Favorites Actions**: Rename and Delete actions are now fully registered and functional.
            - **High Fidelity Packaging**: Standardized with absolute path deployments and detailed build logs.
            - **Tree Duplication Fixed**: Resolved the issue where clicking "Connect" triggered duplicate entries in the database explorer.
            
            Note: The portable version (~83MB) contains the full dependency matrix for immediate use.
          draft: false
          prerelease: false

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robo3t-final-packages
          path: dist/*
          retention-days: 7

      - name: Cleanup Virtual Drives
        if: always()
        run: |
          subst S: /D 2>nul || echo S: not mapped
          subst R: /D 2>nul || echo R: not mapped
          exit 0
        shell: cmd
