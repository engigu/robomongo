# ==============================================================================
# Job 2: 独立运行，直接从云端缓存拉取内核
# ==============================================================================
  build-app:
    runs-on: windows-latest
    steps:
      - name: Checkout Robo 3T
        uses: actions/checkout@v4

      - name: Checkout Robo Shell
        uses: actions/checkout@v4
        with:
          repository: paralect/robomongo-shell
          ref: roboshell-v4.2
          path: robo-shell

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MSVC v141 Toolset Component
        run: |
          $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $process = Start-Process -FilePath $vsInstaller -ArgumentList "modify --installPath ""C:\Program Files\Microsoft Visual Studio\2022\Enterprise"" --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.VC.v141.ATL --add Microsoft.VisualStudio.Component.VC.v141.MFC --quiet --norestart" -PassThru
          while (!$process.HasExited) { Start-Sleep -Seconds 30 }
        shell: powershell

      - name: Setup MSVC (v141 Toolset)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.1'
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action/action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qtwebengine'

      - name: Cache Robo Shell (Restoring from Cloud)
        uses: actions/cache@v4
        with:
          path: robo-shell/build
          # 依然保留模糊匹配，但在根目录下路径更干净
          key: ${{ runner.os }}-robo-shell-v141-${{ hashFiles('fix/apply_patches.py') }}
          restore-keys: |
            ${{ runner.os }}-robo-shell-v141-
          fail-on-cache-miss: true

      - name: Install OpenSSL
        run: choco install openssl -y --no-progress

      - name: Configure and Build Robo 3T
        env:
          # 指向平铺后的 shell 路径
          MongoDB_OBJECTS: ${{ github.workspace }}/robo-shell
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -T v141 -DCMAKE_PREFIX_PATH="${{ env.Qt5_Dir }}" -DMongoDB_DIR="${{ github.workspace }}/robo-shell" -DOpenSSL_DIR="C:/Program Files/OpenSSL" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release -j 2
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: robo3t-final-binary
          path: |
            build/bin/Release/robo3t.exe
            build/bin/Release/*.dll
