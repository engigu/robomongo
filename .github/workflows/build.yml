name: Build Robo 3T Windows EXE

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Checkout Robo 3T
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.7'

    - name: Install Dependencies
      run: |
        pip install --force-reinstall scons==4.3.0
        pip install Cheetah3
        pip install psutil pymongo pyyaml regex setuptools typing
        choco install nsis -y

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.12.8'
        arch: 'win64_msvc2017_64'

    - name: Setup OpenSSL
      run: |
        # 优先查找系统中可能存在的 OpenSSL 路径
        $paths = @(
          "C:\Program Files\OpenSSL-Win64",
          "C:\Program Files\OpenSSL",
          "C:\Program Files (x86)\OpenSSL-Win32"
        )
        $found = $false
        foreach ($p in $paths) {
          if (Test-Path "$p\bin\openssl.exe") {
            echo "OPENSSL_ROOT=$p" | Out-File -FilePath $env:GITHUB_ENV -Append
            $found = $true
            Write-Host "Found pre-installed OpenSSL at $p"
            break
          }
        }
        if (-not $found) {
          Write-Host "OpenSSL not found, installing via choco..."
          choco install openssl -y --no-progress
          $opensslPath = (Get-Item "C:\Program Files\OpenSSL*").FullName
          echo "OPENSSL_ROOT=$opensslPath" | Out-File -FilePath $env:GITHUB_ENV -Append
        }
      shell: powershell

    - name: Cache Robo Shell
      id: cache-shell
      uses: actions/cache@v4
      with:
        path: ../robo-shell
        key: ${{ runner.os }}-robo-shell-v4.2

    - name: Build Robo Shell (if not cached)
      if: steps.cache-shell.outputs.cache-hit != 'true'
      run: |
        cd ..
        git clone --recursive --branch roboshell-v4.2 https://github.com/paralect/robomongo-shell.git robo-shell
        cd robo-shell
        
        # 核心修复 1：地毯式修补所有 SCons 配置文件，强制禁用 /WX 并开启 /permissive
        python -c "import os; [([open(os.path.join(root, f), 'w', encoding='utf-8').write(open(os.path.join(root, f), 'r', encoding='utf-8', errors='ignore').read().replace('env = Environment(', 'env = Environment(ENV = os.environ, ').replace('/WX', '/WX-').replace('/permissive-', '/permissive')) for f in files if f in ['SConstruct', 'SConscript']]) for root, dirs, files in os.walk('.'))]"
        
        # 核心修复 2：针对 VS 2022 修复 mozjs 的源码兼容性问题 (C7626) - 使用正则精准替换所有匿名结构体
        python -c "import os, re; path='src/third_party/mozjs-60/extract/js/src/gc/StoreBuffer.h'; content=open(path).read(); content=re.sub(r'typedef struct \{(.*?)\} (\w+);', r'struct \2 {\1};', content, flags=re.dotall); open(path, 'w').write(content)"
        
        # 核心修复 3：针对 VS 2022 修复 S2 库的 stdext 兼容性问题
        python -c "import os; path='src/third_party/s2/s2cellid.cc'; content=open(path).read(); content=content.replace('size_t stdext::hash_value', 'size_t hash_value'); open(path, 'w').write(content)"
        
        scons mongo.exe -j2 --link-model=object --disable-minimum-compiler-version-enforcement
      shell: cmd

    - name: Configure and Build Robo 3T
      env:
        ROBOMONGO_CMAKE_PREFIX_PATH: "${{ env.Qt5_Dir }};${{ github.workspace }}\\..\\robo-shell;C:\\Program Files\\OpenSSL-Win64"
      run: |
        .\bin\configure.bat
        .\bin\build.bat
        .\bin\install.bat
      shell: cmd

    - name: Package with NSIS
      env:
        ROBOMONGO_CMAKE_PREFIX_PATH: "${{ env.Qt5_Dir }};${{ github.workspace }}\\..\\robo-shell;C:\\Program Files\\OpenSSL-Win64"
      run: |
        .\bin\pack.bat
      shell: cmd

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Robo3T-Fixed-Windows
        path: build/Release/package/*.exe
